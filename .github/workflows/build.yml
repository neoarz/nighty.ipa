name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: >
          xcodebuild build
          -project Nighty.xcodeproj
          -scheme Nighty
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nighty.app Payload/
          zip -qry Nighty.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          path: Nighty.ipa
          archive: false
          if-no-files-found: error
